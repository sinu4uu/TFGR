services:
  - type: web
    name: paymt-verify-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT api.index:app
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: EMAIL_ADDRESS
        sync: false
      - key: EMAIL_APP_PASS
        sync: false
      - key: MAX_AGE_SECONDS
        value: 86400
